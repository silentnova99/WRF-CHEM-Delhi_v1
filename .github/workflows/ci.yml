name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install libeccodes (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeccodes-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,module2,api]"
          python -c "import eccodes, cfgrib; print('grib stack ok')"

      - name: Run test suite (offline, deterministic)
        env:
          PYTHONHASHSEED: 0
        run: python -m pytest --tb=short