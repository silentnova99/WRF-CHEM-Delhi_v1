[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrf-chem-delhi"
version = "2.0.0"
description = "WRF-CHEM DELHI V2 — physics-informed reduced-order coupled atmospheric forecasting (SIH prototype)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dateutil>=2.8",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "orjson>=3.9",
]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]
redis = [
    "redis>=5.0",
]
module2 = [
    "eccodes>=2.36",
    "cfgrib>=0.9",
    "xarray>=2024.1",
    "netCDF4>=1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aqf_delhi = ["dashboard/static/*.html", "dashboard/static/*.js", "dashboard/static/*.css"]
wrf_chem_delhi = ["dashboard_v2/static/*.html", "dashboard_v2/static/*.js", "dashboard_v2/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]