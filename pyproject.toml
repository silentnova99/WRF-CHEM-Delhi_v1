[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqf-delhi"
version = "0.1.0"
description = "Delhi NCR Air Pollution-Weather Coupled Forecasting System — Phase-1 data ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "orjson>=3.9",
]
redis = [
    "redis>=5.0",
]
module2 = [
    "eccodes>=2.36",
    "cfgrib>=0.9",
    "xarray>=2024.1",
    "scipy>=1.12",
    "netCDF4>=1.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aqf_delhi = ["dashboard/static/*.html", "dashboard/static/*.js", "dashboard/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"